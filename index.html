<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lost Dream</title>
  <meta name="description" content="Lost Dream: a story of love, memory and a journey from Hisor to Paris.">
  <meta name="theme-color" content="#070e1d">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lost Dream">
  <meta property="og:title" content="Lost Dream — a story from Hisor to Paris">
  <meta property="og:description" content="Shahiniyor is twenty, yet in his heart he is still that twelve-year-old boy. Read the story for free.">
  <meta property="og:image" content="https://lostdreambook.github.io/images/og.jpg">
  <meta property="og:url" content="https://lostdreambook.github.io/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&display=swap">
  <style>
    :root {
      --bg: #070e1d;
      --bg2: #0f1b33;
      --card: rgba(15, 27, 51, 0.78);
      --fg: #f0ebe0;
      --muted: #a6b1c7;
      --gold: #e2be64;
      --gold-soft: rgba(226, 190, 100, 0.16);
      --gold-ink: #070e1d;
      --clay: #3b2d22;
      --clay-light: #5a4433;
      --line: rgba(226, 190, 100, 0.22);
      --font: "Literata", Georgia, "Times New Roman", serif;
      --fs: 20px;
      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f6f2e8;
        --bg2: #ebe4d5;
        --card: rgba(255, 252, 245, 0.85);
        --fg: #1b2436;
        --muted: #5a6375;
        --gold: #8c6514;
        --gold-soft: rgba(140, 101, 20, 0.12);
        --gold-ink: #fbf8ee;
        --clay: #c8b69e;
        --clay-light: #dfd2be;
        --line: rgba(140, 101, 20, 0.24);
        color-scheme: light;
      }
    }

    :root[data-theme="light"] {
      --bg: #f6f2e8;
      --bg2: #ebe4d5;
      --card: rgba(255, 252, 245, 0.85);
      --fg: #1b2436;
      --muted: #5a6375;
      --gold: #8c6514;
      --gold-soft: rgba(140, 101, 20, 0.12);
      --gold-ink: #fbf8ee;
      --clay: #c8b69e;
      --clay-light: #dfd2be;
      --line: rgba(140, 101, 20, 0.24);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(226, 190, 100, 0.08), transparent 70%),
        radial-gradient(circle at 85% 20%, rgba(44, 74, 130, 0.18), transparent 50%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg);
      z-index: 30;
    }

    .wrap {
      max-width: 70rem;
      margin-inline: auto;
      padding-left: max(18px, env(safe-area-inset-left, 0px));
      padding-right: max(18px, env(safe-area-inset-right, 0px));
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 3px; }

    .bar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 40;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .bar .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-block: 11px;
      min-height: 58px;
    }

    .brand {
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand svg {
      flex: none;
      width: 24px;
      height: 24px;
    }

    .brand span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .seg button {
      background: none;
      border: 0;
      padding: 6px 11px;
      font-size: 0.85rem;
      min-width: 40px;
      color: var(--muted);
    }

    .seg button[aria-pressed="true"] {
      background: var(--gold);
      color: var(--gold-ink);
      font-weight: 700;
    }

    .ibtn {
      background: none;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      min-width: 38px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .ibtn:hover {
      color: var(--fg);
      border-color: var(--gold);
    }

    .progress {
      position: absolute;
      left: 0;
      bottom: -1px;
      height: 2px;
      width: 0;
      background: var(--gold);
    }

    .hero {
      padding-block: 28px 64px;
    }

    .banner {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, #060b18 0%, #0d1a34 65%, #162238 100%);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(226, 190, 100, 0.12);
    }

    .banner img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      object-fit: cover;
    }

    .banner.empty {
      display: none;
    }

    .banner.empty + .hero-card {
      margin-top: 0;
    }

    .chimg {
      margin: 0 0 1.6em;
    }

    .chimg img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .hero-card {
      max-width: 48rem;
      margin: -34px auto 0;
      position: relative;
      z-index: 10;
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px 26px 30px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
    }

    .arch-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid var(--line);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .hero-card h1 {
      font-size: clamp(1.9rem, 4.5vw, 2.8rem);
      line-height: 1.15;
      margin: 0 0 12px;
      font-weight: 700;
      color: var(--fg);
    }

    .lede {
      font-size: clamp(1.05rem, 2.2vw, 1.22rem);
      color: var(--fg);
      opacity: 0.92;
      max-width: 34em;
      margin: 0 auto 24px;
      text-wrap: pretty;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gold);
      color: var(--gold-ink);
      padding: 13px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 8px 24px rgba(226, 190, 100, 0.28);
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .cta:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }

    .meta-line {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .chapters {
      padding-block: 10px 76px;
    }

    .sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .chapters h2 {
      font-size: 1.55rem;
      font-weight: 700;
      margin: 0;
      color: var(--gold);
    }

    .sub {
      color: var(--muted);
      margin: 0;
      font-size: 0.95rem;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr));
      gap: 16px;
    }

    .list a {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 20px 20px 18px;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 14px 14px 8px 8px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    }

    .list a::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 76px;
      height: 4px;
      background: var(--gold);
      border-radius: 0 0 6px 6px;
      opacity: 0.7;
    }

    .list a:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .ch-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 34px;
      border: 1px solid var(--gold);
      border-radius: 15px 15px 4px 4px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.88rem;
      background: var(--gold-soft);
    }

    .cm {
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .ct {
      font-size: 1.22rem;
      font-weight: 700;
      display: block;
      margin-bottom: 6px;
    }

    .ce {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
      text-wrap: pretty;
    }

    .watch {
      padding-block: 0 64px;
    }

    .watch .box {
      display: grid;
      grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
      gap: 28px;
      align-items: center;
      max-width: 52rem;
      margin-inline: auto;
    }

    .watch video {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #000;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .watch h2 {
      font-size: 1.55rem;
      margin: 0 0 10px;
      color: var(--gold);
    }

    .watch p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 16px 0 18px;
    }

    .links a {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 0.9rem;
      color: var(--fg);
    }

    .links a:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .navlink {
      font-size: 0.9rem;
      color: var(--muted);
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .navlink:hover,
    .navlink[aria-current="page"] {
      color: var(--gold);
      border-color: var(--gold);
    }

    .about h2 {
      font-size: 1.3em;
      color: var(--gold);
      margin: 1.6em 0 0.6em;
    }

    .about .links {
      justify-content: flex-start;
    }

    .foot {
      border-top: 1px solid var(--line);
      padding-block: 32px 52px;
      color: var(--muted);
      text-align: center;
    }

    .foot p {
      margin: 0 0 6px;
    }

    .foot strong {
      color: var(--gold);
      font-weight: 700;
    }

    .read {
      padding-block: 40px 48px;
      animation: fade 0.4s ease-out both;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .col {
      max-width: 36em;
      margin-inline: auto;
      font-size: var(--fs);
    }

    .kicker {
      color: var(--gold);
      font-size: 0.8em;
      margin: 0 0 8px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .read h1 {
      font-size: clamp(2rem, 6vw, 3.1rem);
      line-height: 1.12;
      font-weight: 700;
      margin: 0 0 1.15em;
      text-wrap: balance;
      letter-spacing: -0.01em;
    }

    .read p {
      margin: 0 0 1.15em;
      line-height: 1.82;
      text-wrap: pretty;
      overflow-wrap: break-word;
    }

    .read p.dlg {
      padding-left: 1.3em;
      text-indent: -1.3em;
    }

    .pager {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 3em;
      padding-top: 1.4em;
      border-top: 1px solid var(--line);
      font-size: 17px;
    }

    .pager a,
    .pager .end {
      display: block;
      padding: 14px 16px;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      min-width: 0;
    }

    .pager a:hover {
      border-color: var(--gold);
    }

    .pager small {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .pager b {
      display: block;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pager .next {
      text-align: right;
      grid-column: 2;
    }

    .pager .prev {
      grid-column: 1;
    }

    .pager .end {
      color: var(--muted);
      grid-column: 1 / -1;
      text-align: center;
    }

    @media (max-width: 680px) {
      .hero { padding-block: 16px 48px; }
      .hero-card { margin-top: -18px; padding: 22px 18px 24px; }
      .brand span { max-width: 9.5em; }
      .bar.reading .brand span { display: none; }
      .pager { grid-template-columns: 1fr; }
      .watch .box { grid-template-columns: 1fr; text-align: center; }
      .watch video { max-width: 300px; margin-inline: auto; }
      .pager .next, .pager .prev { grid-column: 1; text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      .read { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const STORY = {
      en: {
        chapters: [
          {
            title: "Night",
            img: "images/ch1.jpg",
            alt: "Shahiniyor sitting by the window at night",
            paras: [
              "It was night, and I was looking at the sky. I am a twenty-year-old young man, yet in my heart I am still that twelve-year-old boy. Silence ruled the house. I was sitting on the edge of the bed when suddenly that day came back to me.",
              "Everything started from there."
            ]
          },
          {
            title: "Summer",
            img: "images/ch2.jpg",
            alt: "Shahiniyor and Eliza running in a village street",
            paras: [
              "Her name was Eliza. She lived in Hisor, in the house right across from ours, and she was so beautiful that I fell in love with her at first glance.",
              "That summer I was twelve. We played every day: in the dusty streets of the village, between the mud houses, she ran and I ran after her. I thought happiness would stay like that forever."
            ]
          },
          {
            title: "The Worst Day",
            img: "images/ch3.jpg",
            alt: "Eliza telling Shahiniyor they are leaving",
            paras: [
              "Yet that day was the worst day of my life.",
              "We were playing happily and running around. Suddenly she stopped and said:",
              "— Shahiniyor... I have to tell you something.",
              "Everything around went quiet.",
              "— My father found a job abroad.",
              "— We are leaving this place... To somewhere very far away... Out of this country.",
              "I froze on the spot. She said this and came up to me. I didn't know what to do, and stayed silent.",
              "Eliza put a letter-like piece of paper into my hand and left a soft kiss on my cheek. And she ran away herself.",
              "I ran after her. But when I reached their house, she had already gotten into a car. The car pulled away, as if Eliza had looked at the clock and seen it was time for them to leave.",
              "They left. And I stood at the end of the street, watching after the car until the dust settled."
            ]
          },
          {
            title: "The Paper",
            img: "images/ch4.jpg",
            alt: "The moon through the window",
            paras: [
              "That paper is still with me. For eight years I kept it between the pages of a book and never dared to open it. If I opened it, I would be admitting that that day was truly over.",
              "Tonight I opened it.",
              "On it was a small drawing of Eliza, sketched in pencil and smiling. And next to it were a few lines in childlike handwriting: \"We are going to Paris. Shahiniyor, find me.\"",
              "I fixed my gaze from the window on the moon. \"I don't know where to go or what to do,\" I had said. Now I knew."
            ]
          },
          {
            title: "The Journey",
            paras: [
              "I held the paper in my hand for a long time. I was stunned and didn't sleep until dawn. I grew up in a village and was raised on farm work, and I could do any kind of work. So I decided to go to the city for work first.",
              "In the morning I woke up, washed my face and hands, and went to the kitchen to see my mother. We had breakfast together. After eating, I stayed silent for a moment and looked at my mother with serious eyes.",
              "— Mother, I made a decision with myself last night. We can't live in this condition forever. We have to improve our life.",
              "— I was thinking the same thing, — my mother said. — But tell me, my son, what should we do?",
              "— I'm going to the city, to Dushanbe, to work. The money I earn, I'll send to you from there by card.",
              "My mother agreed and said:",
              "— But my dear son, it's your first time going to the city for work. Do you have any acquaintance or friend there that you speak with so much confidence?",
              "— Mother, I don't have any acquaintance, nor any friend, and we don't have any relative we can get help from. That's why I thought about this from night until morning and came to a conclusion. First I'll go to some restaurant and see if they need a waiter or a cook. If I find a job like that, very good, I'll rent a room nearby and start working.",
              "This time my mother agreed happily. I got ready. My mother gave me two loaves she had baked and saw me off. I said goodbye to my mother and left.",
              "I didn't tell my mother that I was going for Eliza. I didn't want my mother to find out about my heartache and become sad. I knew I couldn't go from Hisor straight to Paris. So I set a goal for myself and left home with that goal.",
              "That is how my journey began."
            ]
          },
          {
            title: "Dushanbe",
            paras: [
              "After two hours on the road, I finally reached Dushanbe. Wide avenues, broad multi-lane roads, and multi-story buildings opened up before my eyes. It was the first time I had come to Dushanbe alone.",
              "I said to myself:",
              "— Hello, Dushanbe.",
              "I opened the map on my phone and headed toward the nearest restaurant. When I arrived, I went inside and spoke with the manager of the restaurant. Fortunately, they needed a waiter and hired me. They set only one condition: I had to do at least three days of internship. I agreed.",
              "Nearby, I rented a place to stay. I spoke with the landlord and said I would pay the rent at the end of every month. Besides rent, I also needed money for electricity, water, and trash, and I had accounted for all of that.",
              "Tomorrow was my first day of internship, so I decided to rest well until tomorrow.",
              "That first day I went to the apartment and thought about Eliza until evening. My thoughts and mind were with her. I kept telling myself:",
              "— If I reach her, will she recognize me? After all, she is my childhood friend. I have many memories with her, I can introduce myself to her in any way.",
              "Yet the most important question now was: how will I get to Paris?"
            ]
          },
          {
            title: "The Internship",
            paras: [
              "When I came to my senses, I saw that the place wasn't in very good condition. So I stood up and started cleaning. I swept all the rooms, tidied everything up, and then set about making dinner. I cooked a traditional Tajik qurutob and ate it with appetite.",
              "I had brought about 1,000 somoni from home for ten days so I wouldn't run into trouble. Thank God, the money was enough for the first days, and I spent it on food and essential expenses. It was around 10:00 PM. Before falling asleep, one thought kept turning in my mind: \"This hard work and this money will one day take me toward Eliza, to Paris.\" With that hope, I closed my eyes.",
              "In the morning, I woke up at 6:45 AM, washed my face and hands, and made breakfast. When I checked the clock, it was 7:20. My internship started at 8:00, so I slowly got ready to leave. Since the restaurant was close to my rented room, I left the house at 7:40 and headed toward work.",
              "When I arrived, the manager saw that I had come about ten minutes before the shift started. With a welcoming smile, he took me over to the other staff so they could train me. They gave me a waiter's uniform and showed me the ropes. I got to work, walked up to the guests, and politely asked:",
              "— How may I serve you?"
            ]
          }
        ]
      }
    };
  </script>

            "Lost Dream is the story of Shahiniyor, a young man from Hisor, Tajikistan. At twelve, he lost the girl he loved when her family moved abroad. Eight years later he opens the paper she left him, and his journey toward Paris begins.",
            "The story is written by Abdullozoda Miyonmuhammad, who grew up in Hisor. Lost Dream began as a story he wrote at sixteen. Now it is being finished chapter by chapter and shared here for free.",
            "New chapters are released regularly. You can follow the story on social media to know when the next chapter comes out."
          ],
          aboutContact: "Contact",
          aboutContactText: "Questions, ideas or feedback? Write to us:",
          backHome: "Back to the home page",
          watch: "Watch Part 1",
          watchText: "One minute: the night, the summer, the worst day, and the paper Eliza left behind."
        }
      };

      var RELEASED = 4;

      var LINKS = {
        instagram: "",
        telegram: "https://t.me/lostdreambook",
        youtube: "https://www.youtube.com/@Lost-Dream-official",
        email: "lostdream.book@gmail.com"
      };

      function visible() { return STORY[state.lang].chapters.slice(0, RELEASED); }

      var state = { lang: "en", fs: 20 };
      var root = document.documentElement;
      var app = document.getElementById("app");

      function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

      var f0 = parseInt(load("od-fs"), 10);
      if (!isNaN(f0) && f0 >= 16 && f0 <= 28) state.fs = f0;

      var t0 = load("od-theme");
      if (t0 === "light" || t0 === "dark") root.setAttribute("data-theme", t0);

      root.style.setProperty("--fs", state.fs + "px");

      function words(arr) { return arr.join(" ").trim().split(/\s+/).length; }
      function mins(ch) { return Math.max(1, Math.round(words(ch.paras) / 170)); }
      function excerpt(ch) {
        var p = ch.paras[0] || "";
        if (p.length <= 105) return p;
        var cut = p.slice(0, 105);
        var lastSpace = cut.lastIndexOf(" ");
        return (lastSpace > 0 ? cut.slice(0, lastSpace) : cut) + "…";
      }
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      var CRESCENT_STAR =
        '<svg viewBox="0 0 28 28" aria-hidden="true">' +
        '<defs><mask id="m-logo"><rect width="28" height="28" fill="#fff"/><circle cx="17" cy="11" r="8.5" fill="#000"/></mask></defs>' +
        '<circle cx="12.5" cy="14.5" r="9.5" fill="#e2be64" mask="url(#m-logo)"/>' +
        '<polygon points="18,6.5 19.2,9.8 22.7,9.8 19.9,11.8 21,15.1 18,13.1 15,15.1 16.1,11.8 13.3,9.8 16.8,9.8" fill="#e2be64"/>' +
        '</svg>';

      var THEME_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="display:block;margin:auto"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4 A8 8 0 0 1 12 20 Z" fill="currentColor"/></svg>';

      var BOOK_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

      function bar(view, ui) {
        var tools =
          '<div class="tools">' +
          (view.type !== "read" ? '<a class="navlink" href="#about"' + (view.type === "about" ? ' aria-current="page"' : '') + '>' + esc(ui.about) + '</a>' : '') +
          (view.type === "read"
            ? '<button class="ibtn" data-act="fs-" aria-label="' + esc(ui.smaller) + '">A−</button><button class="ibtn" data-act="fs+" aria-label="' + esc(ui.larger) + '">A+</button>'
            : '') +
          '<button class="ibtn" data-act="theme" aria-label="' + esc(ui.theme) + '">' + THEME_ICON + '</button>' +
          '</div>';

        return '<header class="bar' + (view.type === "read" ? ' reading' : '') + '">' +
          '<div class="wrap"><a class="brand" href="#home" aria-label="' + esc(ui.home) + '">' + CRESCENT_STAR + '<span>' + esc(ui.title) + '</span></a>' + tools + '</div>' +
          (view.type === "read" ? '<div class="progress" id="progress"></div>' : '') +
          '</header>';
      }

      function links() {
        var out = [];
        if (LINKS.instagram) out.push('<a href="' + esc(LINKS.instagram) + '" target="_blank" rel="noopener">Instagram</a>');
        if (LINKS.youtube) out.push('<a href="' + esc(LINKS.youtube) + '" target="_blank" rel="noopener">YouTube</a>');
        if (LINKS.telegram) out.push('<a href="' + esc(LINKS.telegram) + '" target="_blank" rel="noopener">Telegram</a>');
        if (LINKS.email) out.push('<a href="mailto:' + esc(LINKS.email) + '">' + esc(LINKS.email) + '</a>');
        return out.length ? '<div class="links">' + out.join("") + '</div>' : '';
      }

      function home(ui, chs) {
        var items = chs.map(function (c, i) {
          return '<li><a href="#ch-' + (i + 1) + '">' +
            '<div><div class="ch-top"><span class="num">' + (i + 1) + '</span><span class="cm">' + mins(c) + ' ' + esc(ui.min) + '</span></div>' +
            '<span class="ct">' + esc(c.title) + '</span>' +
            '<span class="ce">' + esc(excerpt(c)) + '</span></div>' +
            '</a></li>';
        }).join("");

        return '<main>' +
          '<section class="hero"><div class="wrap">' +
          '<div class="banner"><img src="images/cover.jpg" alt="Lost Dream" onerror="this.parentNode.classList.add(\'empty\')"></div>' +
          '<div class="hero-card">' +
          '<div class="arch-badge">' + esc(ui.badge) + '</div>' +
          '<h1>' + esc(ui.title) + '</h1>' +
          '<p class="lede">' + esc(ui.lede) + '</p>' +
          '<a class="cta" href="#ch-1">' + BOOK_ICON + '<span>' + esc(ui.start) + '</span></a>' +
          '<p class="meta-line">' + esc(ui.meta(chs.length)) + '</p>' +
          '</div>' +
          '</div></section>' +
          '<section class="watch"><div class="wrap"><div class="box">' +
          '<video controls playsinline preload="none" poster="images/part1-poster.jpg"><source src="videos/part1.mp4" type="video/mp4"></video>' +
          '<div><h2>' + esc(ui.watch) + '</h2><p>' + esc(ui.watchText) + '</p><a class="cta" href="#ch-1">' + BOOK_ICON + '<span>' + esc(ui.start) + '</span></a></div>' +
          '</div></div></section>' +
          '<section class="chapters"><div class="wrap">' +
          '<div class="sec-head"><h2>' + esc(ui.chapters) + '</h2><p class="sub">' + esc(ui.chaptersSub) + '</p></div>' +
          '<ol class="list">' + items + '</ol>' +
          '</div></section>' +
          '</main>' +
          '<footer class="foot"><div class="wrap"><p><strong>' + esc(ui.foot1) + '</strong></p><p>' + esc(ui.foot2) + '</p>' + links() + '<p><a class="navlink" href="#about">' + esc(ui.about) + '</a></p><p>' + esc(ui.copy) + '</p></div></footer>';
      }

      function about(ui) {
        return '<main class="read about"><div class="wrap"><article class="col">' +
          '<h1>' + esc(ui.aboutTitle) + '</h1>' +
          ui.aboutParas.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join("") +
          '<h2>' + esc(ui.aboutContact) + '</h2>' +
          '<p>' + esc(ui.aboutContactText) + '</p>' +
          links() +
          '<nav class="pager"><a class="prev" href="#home"><small>&larr;</small><b>' + esc(ui.backHome) + '</b></a></nav>' +
          '</article></div></main>';
      }

      function read(ui, chs, n) {
        var ch = chs[n - 1];
        var paras = ch.paras.map(function (p) {
          return '<p' + (p.trim().charAt(0) === "—" ? ' class="dlg"' : '') + '>' + esc(p) + '</p>';
        }).join("");

        var figure = ch.img
          ? '<figure class="chimg"><img src="' + esc(ch.img) + '" alt="' + esc(ch.alt || ch.title) + '" loading="lazy" onerror="this.parentNode.remove()"></figure>'
          : '';

        var prev = n > 1
          ? '<a class="prev" href="#ch-' + (n - 1) + '"><small>' + esc(ui.prev) + '</small><b>' + esc(chs[n - 2].title) + '</b></a>'
          : '';

        var next = n < chs.length
          ? '<a class="next" href="#ch-' + (n + 1) + '"><small>' + esc(ui.next) + '</small><b>' + esc(chs[n].title) + '</b></a>'
          : '<div class="end"><b>' + esc(ui.endTitle) + '</b><small>' + esc(ui.endText) + '</small></div>';

        return '<main class="read"><div class="wrap"><article class="col">' +
          '<p class="kicker">' + esc(ui.chapterOf(n, chs.length)) + '</p>' +
          '<h1>' + esc(ch.title) + '</h1>' +
          figure +
          paras +
          '<nav class="pager">' + prev + next + '</nav>' +
          '</article></div></main>';
      }

      function parse() {
        var m = /^#ch-(\d+)$/.exec(location.hash || "");
        var n = m ? parseInt(m[1], 10) : 0;
        var chs = visible();
        if (n >= 1 && n <= chs.length) return { type: "read", n: n };
        if (location.hash === "#about") return { type: "about" };
        return { type: "home" };
      }

      function render(scroll) {
        try {
          var view = parse();
          var ui = UI[state.lang];
          var chs = visible();
          root.setAttribute("lang", state.lang);
          document.title = ui.title;
          app.innerHTML = bar(view, ui) + (view.type === "read" ? read(ui, chs, view.n) : view.type === "about" ? about(ui) : home(ui, chs));
          if (scroll) window.scrollTo(0, 0);
          updateProgress();
        } catch (err) {
          app.innerHTML = '<main class="read"><div class="wrap"><p>Something went wrong while displaying the page.</p></div></main>';
        }
      }

      function updateProgress() {
        var p = document.getElementById("progress");
        if (!p) return;
        var h = document.documentElement.scrollHeight - window.innerHeight;
        var r = h > 0 ? Math.min(1, Math.max(0, window.scrollY / h)) : 0;
        p.style.width = (r * 100) + "%";
      }

      function effectiveTheme() {
        var a = root.getAttribute("data-theme");
        if (a) return a;
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }

      app.addEventListener("click", function (e) {
        var a = e.target.closest("a[href^='#']");
        if (a && parse().type !== "home") {
          var href = a.getAttribute("href");
          var isHome = href === "#home" || href === "#";
          e.preventDefault();
          if (isHome && history.state && history.state.fromHome) {
            history.back();
          } else if (isHome) {
            history.replaceState(null, "", "#home");
            render(true);
          } else {
            history.replaceState(history.state, "", href);
            render(true);
          }
          return;
        }
        if (a && parse().type === "home" && a.getAttribute("href") !== "#home") {
          e.preventDefault();
          history.pushState({ fromHome: true }, "", a.getAttribute("href"));
          render(true);
          return;
        }
        var t = e.target.closest("button");
        if (!t) return;
        if (t.dataset.act === "theme") {
          var next = effectiveTheme() === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          save("od-theme", next);
        } else if (t.dataset.act === "fs+" || t.dataset.act === "fs-") {
          state.fs = Math.min(28, Math.max(16, state.fs + (t.dataset.act === "fs+" ? 2 : -2)));
          root.style.setProperty("--fs", state.fs + "px");
          save("od-fs", state.fs);
          updateProgress();
        }
      });

      if (parse().type !== "home") {
        var startHash = location.hash;
        history.replaceState(null, "", "#home");
        history.pushState({ fromHome: true }, "", startHash);
      }

      window.addEventListener("popstate", function () { render(true); });
      window.addEventListener("hashchange", function () { render(true); });
      window.addEventListener("scroll", updateProgress, { passive: true });
      window.addEventListener("resize", updateProgress);
      render(false);
    })();
  </script>
</body>
</html>
